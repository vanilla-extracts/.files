[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[[language]]
name = "typst"
auto-format = true
formatter.command = "typstyle"
language-servers = ["tinymist", "harper-ls"]

[[language]]
name = "markdown"
language-servers = ["markdown-oxide", "harper-ls"]

[[language]]
name = "rust"
language-servers = ["rust-analyzer", "harper-ls"]

[language-server.harper-ls.config.harper-ls]
userDictPath = ""
fileDictPath = ""
diagnosticSeverity = "hint"
isolateEnglish = false
dialect = "British"

[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]
config = { userLanguages = { astro = "html", "*.astro" = "html" } }

[[language]]
name = "css"
language-servers = ["tailwindcss-ls", "vscode-css-language-server" ]

[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "tailwindcss-ls"]
