theme = "catppuccin_macchiato"

[editor]
mouse = false
bufferline = "always"
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = true

[editor.statusline]
left = ["mode", "spinner"]
center = ["file-name"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-inlay-hints = true

[keys.normal]
C-left = ":buffer-previous"
C-right = ":buffer-next"
C-o = ":buffer-close"
C-a = "file_picker_in_current_directory"
S-left = "move_prev_word_start"
S-right = "move_next_word_start"
S-up = "page_cursor_half_up"
S-down = "page_cursor_half_down"
